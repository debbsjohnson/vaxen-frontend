# fly.toml app configuration file generated for web-fragrant-pine-2987
app = 'web-fragrant-pine-2987'
primary_region = 'lhr'

[build]
  context = "../../"
  dockerfile = "Dockerfile"

[env]
  NEXT_PUBLIC_API_URL = "https://vaxen-finance.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
